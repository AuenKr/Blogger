version: "3.9"

services:
  backend:
    container_name: medium_backend
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - path: ./backend/wrangler.toml
        required: true
      - path: ./backend.env
        required: true
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    ports:
      - "8787:8787"

  frontend:
    container_name: medium_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    env_file:
      - path: ./frontend/.env
        required: true
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
